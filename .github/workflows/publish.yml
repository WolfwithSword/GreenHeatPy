name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0"
        required: true
        type: string
      create_release:
        description: "Create release with auto-generated notes"
        required: false
        default: true
        type: boolean

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install -q packaging
          python -c "
          import os, sys
          from packaging.version import Version, InvalidVersion
          v = os.environ['VERSION']
          try:
              assert str(Version(v)) == v
          except (InvalidVersion, AssertionError):
              sys.exit(f'{v!r} is not a normalized PEP 440 version')
          "
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/greenheat/__init__.py
          grep -n "^version" pyproject.toml
          grep -n "^__version__" src/greenheat/__init__.py

      - name: Build
        run: |
          python -m pip install -q build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: versioned-files
          path: |
            pyproject.toml
            src/greenheat/__init__.py

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/greenheat-py/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          name: versioned-files

      - name: Commit and tag version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/greenheat/__init__.py
          git diff --cached --quiet || git commit -m "release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"

      - uses: actions/download-artifact@v6
        if: ${{ inputs.create_release }}
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes --verify-tag