[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "greenheat-py"
version = "0.0.1"
dependencies = [
    "websockets>=17.1",
    "truststore>=0.10.4; python_version >= '3.10'",
]

[project.scripts]
test-greenheat = "greenheat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pyright]
typeCheckingMode = "off"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]