[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greenheat-py"
version = "0.1.0"
description = "An async Python client for GreenHeat, a Twitch stream click/heatmap overlay extension"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
authors = [
  { name = "WolfwithSword", email = "12175651+WolfwithSword@users.noreply.github.com" }
]
maintainers = [
  { name = "WolfwithSword", email = "12175651+WolfwithSword@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["greenheat", "twitch", "heatmap", "websocket", "asyncio", "extension"]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=17.1",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/WolfwithSword/GreenHeatPy"
Documentation = "https://heat.prod.kr/"
Issues = "https://github.com/WolfwithSword/GreenHeatPy/issues"

[project.scripts]
greenheat = "greenheat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
greenheat = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
